apiVersion: v1
kind: ReplicaSet
metadata:
  name: nginx
  # these labels are replicaset
  labels:
    project: roboshop
    purpose: rs-demo
    tier: frontend
    component: frontend
  spec:
    replicaset: 3
    selector:
    # using these labels replicaset set selects the pod
      matchLabels:
        project: roboshop
        purpose: rs-demo
        tier: frontend
        component: frontend
    # this pod definition pod is subnet of replicaset
    template:
      metadata:
        labels:
          project: roboshop
          purpose: rs-demo
          tier: frontend
          component: frontend
        spec:
          containers:
           - name: nginx
             iamge: nginx